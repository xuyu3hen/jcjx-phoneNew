# AGP 8.x + Kotlin 1.9.x 推荐 JDK 17，全局固定（老插件的 getJavaVersion()
# 会先读这里的 java.version 属性，避免它在 compileOptions{} 中动态计算导致
# "sourceCompatibility is not yet finalized" 异常）
java.version=17
org.gradle.java.installations.auto-download=false

org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 \
  -Dhttps.protocols=TLSv1.2,TLSv1.3 \
  -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3 \
  -Dcom.sun.net.ssl.checkRevocation=false
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
kotlin.daemon.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
