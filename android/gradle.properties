# AGP 8.x + Kotlin 1.9.x 推荐 JDK 17，全局固定（老插件的 getJavaVersion()
# 会先读这里的 java.version 属性，避免它在 compileOptions{} 中动态计算导致
# "sourceCompatibility is not yet finalized" 异常）
java.version=17
org.gradle.java.installations.auto-download=false

org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 \
  -Dhttps.protocols=TLSv1.2,TLSv1.3 \
  -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3 \
  -Dcom.sun.net.ssl.checkRevocation=false
android.useAndroidX=true
# Jetifier 会在每次构建时把所有第三方依赖的字节码重写一遍（旧 support→AndroidX），
# 是构建慢的主要来源之一。本项目用的都是 AndroidX 时代的新插件，无需转换。
# 若将来引入依赖旧 com.android.support 的插件导致构建报错，再改回 true
android.enableJetifier=false
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 单 app 模块项目 configure-on-demand 没有收益，偶尔还会导致配置不一致，关闭
org.gradle.configureondemand=false
kotlin.daemon.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
