plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {

    // ----- BEGIN flavorDimensions (autogenerated by flutter_flavorizr) -----
    flavorDimensions "flavor-type"

    productFlavors {
        env_dev {
            dimension "flavor-type"
            applicationId "com.jcjx_phone_dev"
            resValue "string", "app_name", "机车检修(本地)"
        }
        env_release {
            dimension "flavor-type"
            applicationId "com.jcjx_phone_release"
            resValue "string", "app_name", "机车检修"
        }
        env_test {
            dimension "flavor-type"
            applicationId "com.jcjx_phone_test"
            resValue "string", "app_name", "机车检修(测试)"
        }
    }

    // ----- END flavorDimensions (autogenerated by flutter_flavorizr) -----

    namespace "com.jcjx_phone.jcjx_phone"
    // compileSdkVersion flutter.compileSdkVersion
        compileSdkVersion 34
    ndkVersion "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Core Library Desugaring（flutter_local_notifications / qr_code_scanner 等老插件需要 Java 8+ 脱糖 API）
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

        lintOptions {
        warningsAsErrors true
        checkReleaseBuilds false
        abortOnError false
        lintConfig file("lint.xml")
        // 添加这一行
        enable 'Deprecation'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.jcjx_phone.jcjx_phone"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        // minSdkVersion flutter.minSdkVersion
                minSdkVersion flutter.minSdkVersion
        // targetSdkVersion flutter.targetSdkVersion
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }

    // 输出 APK 文件名带版本号，便于归档和现场分发：
    // jcjx-phone-<flavor>-<buildType>-v<versionName>.apk
    // 例：jcjx-phone-env_release-release-v1.2.3.apk
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            output.outputFileName = "jcjx-phone-${variant.flavorName}-${variant.buildType.name}-v${variant.versionName}.apk"
        }
        // Flutter 构建工具在 Gradle 结束后会再复制一份到 outputs/flutter-apk
        // 并改回 app-<flavor>-<buildType>.apk，这里同步把带版本号的包也复制过去
        variant.assembleProvider.get().doLast {
            variant.outputs.each { output ->
                def srcFile = output.outputFile
                if (srcFile != null && srcFile.exists()) {
                    def targetDir = file("${buildDir}/outputs/flutter-apk")
                    targetDir.mkdirs()
                    def targetFile = new File(targetDir, output.outputFileName)
                    if (!targetFile.exists() || targetFile.length() != srcFile.length()) {
                        targetFile.bytes = srcFile.bytes
                    }
                }
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22"
    // Core Library Desugaring 脱糖库（配合 compileOptions.coreLibraryDesugaringEnabled=true）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
